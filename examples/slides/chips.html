<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chips — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-layout-chips">
        <div class="pds-frame">
          <div class="pds-example__chip-wrap">
            <div class="pds-chips">
              <span class="pds-chip"><span class="pds-chip__label">Design</span><span class="pds-chip__value">Principles</span></span>
              <span class="pds-chip"><span class="pds-chip__label">Format</span><span class="pds-chip__value">16:9</span></span>
              <span class="pds-chip"><span class="pds-chip__label">Canvas</span><span class="pds-chip__value">1920 × 1080</span></span>
            </div>
          </div>
        </div>
        <span class="pds-footer-number">05</span>
      </div>
  </main>
</body>
</html>
