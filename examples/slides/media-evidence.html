<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media and evidence — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-media-split">
        <div class="pds-media-split__text">
          <p class="pds-evidence">Prototype</p>
          <h3 class="pds-headline pds-example__media-copy">Show the work itself.</h3>
          <p class="pds-caption">A real image makes the claim concrete.</p>
        </div>
        <figure class="pds-media-split__figure">
          <div class="pds-example__media-placeholder pds-example__media-placeholder--part" role="img" aria-label="Placeholder for an example photograph"></div>
          <figcaption>Prototype · Side view</figcaption>
        </figure>
      </div>
  </main>
</body>
</html>
