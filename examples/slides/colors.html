<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color tokens — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper">
        <div class="pds-frame">
          <div class="pds-swatch-grid">
            <div>
              <div class="pds-swatch__sample" style="background:var(--pds-color-paper)"></div>
              <div class="pds-swatch__label">Paper</div><div class="pds-swatch__value">#FAFAF8</div>
            </div>
            <div>
              <div class="pds-swatch__sample" style="background:var(--pds-color-ink)"></div>
              <div class="pds-swatch__label">Ink</div><div class="pds-swatch__value">#16181D</div>
            </div>
            <div>
              <div class="pds-swatch__sample" style="background:var(--pds-color-night)"></div>
              <div class="pds-swatch__label">Night</div><div class="pds-swatch__value">#0B0B0C</div>
            </div>
            <div>
              <div class="pds-swatch__sample" style="background:var(--pds-color-jade)"></div>
              <div class="pds-swatch__label">Jade</div><div class="pds-swatch__value">#00A878</div>
            </div>
            <div>
              <div class="pds-swatch__sample" style="background:var(--pds-color-alert)"></div>
              <div class="pds-swatch__label">Alert</div><div class="pds-swatch__value">#E5484D</div>
            </div>
            <div>
              <div class="pds-swatch__sample" style="background:var(--pds-color-mute)"></div>
              <div class="pds-swatch__label">Mute</div><div class="pds-swatch__value">#8A8A8E</div>
            </div>
          </div>
          <h3 class="pds-subhead pds-example__type-heading">Typography roles</h3>
          <ul class="pds-example__type-list">
            <li><span>Wordmark</span><span>248px · 700 · −0.04em</span></li>
            <li><span>Hero</span><span>300px · 700 · −0.04em</span></li>
            <li><span>Headline</span><span>92px · 600 · −0.03em</span></li>
            <li><span>Subhead</span><span>60px · 600 · −0.02em</span></li>
            <li><span>Support</span><span>44px · 400 · −0.01em</span></li>
            <li><span>Caption</span><span>28px · 400 · 0</span></li>
          </ul>
        </div>
      </div>
  </main>
</body>
</html>
