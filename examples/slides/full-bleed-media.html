<!doctype html>
<html lang="en">
<head>

  <title>Full-bleed media — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">

<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-media-full">
        <div class="pds-media-full__image pds-example__media-placeholder pds-example__media-placeholder--full" role="img" aria-label="Image placeholder"></div>
