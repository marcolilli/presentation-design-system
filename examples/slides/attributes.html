<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attribute list — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-layout-attributes">
        <div class="pds-frame">
          <p class="pds-label">A useful system</p>
          <ul class="pds-attribute-list pds-example__attrs">
            <li class="pds-attribute-list__item"><strong class="pds-attribute-list__term">Consistent</strong> — shared rules across every slide</li>
            <li class="pds-attribute-list__item"><strong class="pds-attribute-list__term pds-attribute-list__term--accent">Readable</strong> — type sized for the room</li>
            <li class="pds-attribute-list__item"><strong class="pds-attribute-list__term">Flexible</strong> — layouts adapt to the message</li>
          </ul>
        </div>
        <span class="pds-footer-number">06</span>
      </div>
  </main>
</body>
</html>
