<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-layout-flow">
        <div class="pds-frame">
          <p class="pds-label">How it works</p>
          <div class="pds-example__flow-wrap">
            <div class="pds-flow">
              <span class="pds-flow__node">Collect</span>
              <span class="pds-flow__connector" aria-hidden="true"></span>
              <span class="pds-flow__node">Understand</span>
              <span class="pds-flow__connector" aria-hidden="true"></span>
              <span class="pds-flow__node pds-flow__node--accent">Act</span>
            </div>
          </div>
          <p class="pds-summary pds-example__summary">The diagram leads to a one-line takeaway.</p>
        </div>
        <span class="pds-footer-number">04</span>
      </div>
  </main>
</body>
</html>
