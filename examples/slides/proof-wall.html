<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proof wall — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-media-wall">
        <div class="pds-frame">
          <p class="pds-label">Evidence</p>
          <h3 class="pds-headline">Show the details that support the claim.</h3>
        </div>
        <div class="pds-media-wall__grid">
          <figure class="pds-media-wall__cell">
            <div class="pds-media-wall__figure pds-example__media-placeholder" role="img" aria-label="Image placeholder one"></div>
            <figcaption>Image placeholder · View one</figcaption>
          </figure>
          <figure class="pds-media-wall__cell">
            <div class="pds-media-wall__figure pds-example__media-placeholder" role="img" aria-label="Image placeholder two"></div>
            <figcaption>Image placeholder · View two</figcaption>
          </figure>
        </div>
      </div>
  </main>
</body>
</html>
