<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-layout-stats">
        <div class="pds-frame pds-example__stats">
          <div class="pds-stat">
            <div class="pds-stat__value pds-stat__value--accent">84%</div>
            <div class="pds-stat__label">illustrative sample metric</div>
          </div>
          <div class="pds-stat">
            <div class="pds-stat__value">2.4×</div>
            <div class="pds-stat__label">illustrative sample metric</div>
          </div>
        </div>
        <span class="pds-footer-source">Illustrative sample values</span>
        <span class="pds-footer-number">03</span>
      </div>
  </main>
</body>
</html>
