<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headline and supporting line — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-layout-headline">
        <div class="pds-frame">
          <p class="pds-label">The opportunity</p>
          <h3 class="pds-headline">Clear visual hierarchy makes complex ideas easier to follow.</h3>
          <p class="pds-support pds-example__supporting">Make the main point easy to find, then give people just enough context to understand it.</p>
        </div>
        <span class="pds-footer-number">02</span>
      </div>
  </main>
</body>
</html>
