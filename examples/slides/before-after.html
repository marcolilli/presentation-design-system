<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Before and after — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper">
        <div class="pds-frame">
          <p class="pds-label">What changed</p>
          <div class="pds-compare pds-compare--spread pds-example__compare">
            <div class="pds-compare__row">
              <span class="pds-compare__was">Scattered information</span>
              <span class="pds-compare__arrow" aria-hidden="true">→</span>
              <span class="pds-compare__now">One clear <strong>source of truth</strong></span>
            </div>
            <div class="pds-compare__row">
              <span class="pds-compare__was">Hard to scan</span>
              <span class="pds-compare__arrow" aria-hidden="true">→</span>
              <span class="pds-compare__now">A clear <strong>visual hierarchy</strong></span>
            </div>
          </div>
        </div>
        <span class="pds-footer-number">09</span>
      </div>
  </main>
</body>
</html>
