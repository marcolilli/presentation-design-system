<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-layout-table">
        <div class="pds-frame">
          <p class="pds-label">Project snapshot</p>
          <h3 class="pds-headline">Keep details easy to compare.</h3>
          <table class="pds-table">
            <caption>Illustrative example data</caption>
            <thead>
              <tr>
                <th scope="col">Workstream</th>
                <th scope="col">Next step</th>
                <th class="pds-table__numeric" scope="col">Items</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">Research</th>
                <td>Summarize findings</td>
                <td class="pds-table__numeric">3</td>
              </tr>
              <tr>
                <th scope="row">Concept</th>
                <td>Draft first direction</td>
                <td class="pds-table__numeric">2</td>
              </tr>
              <tr>
                <th scope="row">Review</th>
                <td>Gather feedback</td>
                <td class="pds-table__numeric">1</td>
              </tr>
            </tbody>
          </table>
        </div>
        <span class="pds-footer-number">10</span>
      </div>
  </main>
</body>
</html>
