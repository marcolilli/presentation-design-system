<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footnote — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-layout-footnote">
        <div class="pds-frame">
          <p class="pds-label">Cited result</p>
          <h3 class="pds-headline">The response rate rose by 18%<sup class="pds-footnote-ref" id="footnote-ref-1"><a href="#footnote-1" aria-label="Read footnote 1">1</a></sup></h3>
          <p class="pds-support">Keep the headline short and put its qualification in a footnote.</p>
          <ol class="pds-footnotes">
            <li class="pds-footnotes__item" id="footnote-1">
              <a class="pds-footnotes__backlink" href="#footnote-ref-1" aria-label="Back to footnote reference 1">1.</a>
              <span>Illustrative value for this example. Replace it with a verified result, source, and reporting period.</span>
            </li>
          </ol>
        </div>
        <span class="pds-footer-number">11</span>
      </div>
  </main>
</body>
</html>
