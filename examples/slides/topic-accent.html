<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topic accent — Presentation Design System Example</title>
  <link rel="stylesheet" href="../../css/presentation-system.css">
  <link rel="stylesheet" href="../slide-examples.css">
</head>
<body>
  <main class="pds-example__stage">
    <div class="pds-slide pds-slide--paper pds-layout-headline pds-theme--silicon">
        <div class="pds-frame">
          <p class="pds-label pds-accent">A section label</p>
          <h3 class="pds-headline">One meaningful color carries through the slide.</h3>
          <p class="pds-support pds-accent">The label and emphasis use the same topic hue.</p>
        </div>
      </div>
  </main>
</body>
</html>
